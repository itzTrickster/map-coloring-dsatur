name: Core checks

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / Linux
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DMAP_COLORING_BUILD_GUI=OFF
          -DMAP_COLORING_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan / Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
        run: >-
          cmake -S . -B build-sanitized
          -DBUILD_TESTING=ON
          -DMAP_COLORING_BUILD_GUI=OFF
          -DMAP_COLORING_WARNINGS_AS_ERRORS=ON
          -DMAP_COLORING_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure
